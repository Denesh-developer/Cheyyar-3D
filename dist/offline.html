<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0504">
<title>Namma Cheyyar · Offline</title>
<style>
:root{--gold:#ffd34d;--amber:#f0a81c;--line:#6a4a1a;--ink:#fff3dc;--mute:#c9a878;--ok:#5be08a;--bad:#ff6b5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:#0b0504;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Noto Sans",sans-serif}
body{background:radial-gradient(ellipse 90% 70% at 50% 0%,#40200f 0%,#1f0e09 45%,#0b0504 100%)}

/* sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff3dc;opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.95;transform:scale(1.5)}}
.moon{position:absolute;top:calc(env(safe-area-inset-top) + 7vh);right:9vw;width:clamp(38px,8vh,64px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fff8e0 0%,#ffe9a8 55%,#e8c66a 100%);
  box-shadow:0 0 28px 8px rgba(255,211,77,.28),0 0 90px 30px rgba(255,170,60,.12)}
.moon::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 62% 60%,rgba(120,80,20,.22) 0 14%,transparent 15%),radial-gradient(circle at 30% 66%,rgba(120,80,20,.16) 0 9%,transparent 10%)}

/* scene */
.scene{position:fixed;left:0;right:0;bottom:0;height:var(--sceneH);z-index:1;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
:root{--sceneH:clamp(96px,30vh,230px)}
.win{animation:flick 5s ease-in-out infinite}
.win:nth-child(3n){animation-delay:-1.3s}.win:nth-child(4n){animation-delay:-2.7s}.win:nth-child(5n){animation-delay:-.6s}
@keyframes flick{0%,100%{opacity:.95}45%{opacity:.55}50%{opacity:.95}}
.bus{animation:drive 16s linear infinite}
@keyframes drive{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
.dash{animation:roll 1.1s linear infinite}
@keyframes roll{to{stroke-dashoffset:-44}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* content */
.wrap{position:relative;z-index:2;height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),20px) calc(var(--sceneH) * .62) max(env(safe-area-inset-left),20px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:560px}
.ring{position:relative;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#3a1b10,#190a06);border:1.5px solid var(--line);
  box-shadow:0 0 0 5px rgba(255,211,77,.06),0 10px 30px rgba(0,0,0,.55),inset 0 0 18px rgba(255,170,60,.12)}
.ring::before,.ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(255,211,77,.5);animation:pulse 2.6s ease-out infinite}
.ring::after{animation-delay:1.3s}
@keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.7);opacity:0}}
.ring svg{width:38px;height:38px;filter:drop-shadow(0 0 8px rgba(255,211,77,.55))}
.brand{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--gold);opacity:.9;text-transform:uppercase}
h1{margin:0;font-size:clamp(22px,5.6vw,34px);line-height:1.2;font-weight:800;color:var(--ink);text-shadow:0 0 22px rgba(255,190,70,.35)}
.sub{font-size:13px;color:var(--mute);letter-spacing:.04em;margin-top:-4px}
.msg{margin:2px 0 0;font-size:14px;line-height:1.55;color:#ecd9b8;max-width:46ch}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:6px 14px;border-radius:999px;
  background:rgba(42,18,12,.8);border:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.status[data-s=checking] .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink .8s ease-in-out infinite}
.status[data-s=ok] .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
@keyframes blink{50%{opacity:.25}}
.actions{display:flex;align-items:center;gap:14px;margin-top:6px}
button{font:inherit;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  padding:12px 28px;border-radius:999px;font-weight:800;font-size:15px;color:#2a120c;
  background:linear-gradient(180deg,#ffd34d 0%,#f0a81c 100%);
  box-shadow:0 8px 22px rgba(240,168,28,.35),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .12s,filter .2s}
button:active{transform:scale(.96)}
button[disabled]{filter:saturate(.6) brightness(.85);cursor:default}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(42,18,12,.3);border-top-color:#2a120c;display:none;animation:rot .7s linear infinite}
button[disabled] .spin{display:block}
button[disabled] .ico{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.cd{font-size:12px;color:var(--mute);min-width:9ch;text-align:left}
.tip{margin-top:6px;font-size:12.5px;color:var(--mute);min-height:1.4em;transition:opacity .4s}
.tip.out{opacity:0}

/* landscape phones: side-by-side so everything fits */
@media (max-height:480px) and (orientation:landscape){
  .wrap{padding-bottom:calc(var(--sceneH) * .5)}
  .hero{flex-direction:row;text-align:left;gap:22px;max-width:760px;align-items:center}
  .ring{width:76px;height:76px}.ring svg{width:34px;height:34px}
  .txt{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .brand{font-size:10px}
  h1{font-size:clamp(20px,3.6vw,28px)}
  .msg{font-size:12.5px;line-height:1.45;margin:0}
  .actions{margin-top:2px}button{padding:10px 24px;font-size:14px}
  .tip{margin-top:0;font-size:11.5px}
  :root{--sceneH:clamp(80px,26vh,130px)}
}
@media (max-height:480px) and (orientation:landscape){.txt{align-items:flex-start}}
.txt{display:flex;flex-direction:column;align-items:center;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<main class="wrap">
  <section class="hero">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <div class="txt">
      <div class="brand">Namma Cheyyar · 3D</div>
      <h1>இணைய இணைப்பு இல்லை</h1>
      <div class="sub">No internet connection</div>
      <p class="msg">Net on pannunga, appuram thirumba try pannunga. Namma Cheyyar ungalukkaaga wait pannikkitu irukku!</p>
      <div class="status" id="status" data-s="fail"><span class="dot"></span><span id="stext">Connect aagala</span></div>
      <div class="actions">
        <button id="retry" type="button"><span class="spin"></span><span class="ico">🔄</span><span id="btxt">Retry</span></button>
        <span class="cd" id="cd"></span>
      </div>
      <div class="tip" id="tip"></div>
    </div>
  </section>
</main>

<script>
/* >>> UNGA VERCEL URL INGA PODUNGA (https:// venum, kadaisila / venam) <<< */
var GAME_URL = "https://YOUR-PROJECT.vercel.app";

(function(){
  var $ = function(i){return document.getElementById(i)};
  var status = $("status"), stext = $("stext"), retry = $("retry"), btxt = $("btxt"), cd = $("cd"), tipEl = $("tip");
  var busy = false, timer = 0, left = 0;

  /* stars */
  var sky = $("sky"), i, s;
  for (i = 0; i < 70; i++) {
    s = document.createElement("i"); s.className = "star";
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (Math.random() * 62) + "%";
    s.style.animationDelay = (-Math.random() * 3) + "s";
    s.style.animationDuration = (2 + Math.random() * 3) + "s";
    if (Math.random() > .8) { s.style.width = s.style.height = "3px"; }
    sky.appendChild(s);
  }

  /* rotating tips */
  var tips = [
    "📶 Wi-Fi illa Mobile data on irukka nu paarunga",
    "✈️ Airplane mode off-a irukkanum",
    "📡 Signal kammiya irundha konjam veliya vaanga",
    "🔒 VPN on irundha off panni paarunga",
    "🎬 Net vandhaa theatre-la unga seat ready!"
  ], ti = 0;
  function showTip(){
    tipEl.classList.add("out");
    setTimeout(function(){ tipEl.textContent = tips[ti++ % tips.length]; tipEl.classList.remove("out"); }, 400);
  }
  showTip(); setInterval(showTip, 4500);

  function setState(st, text){ status.setAttribute("data-s", st); stext.textContent = text; }

  function schedule(){
    clearInterval(timer); left = 8; cd.textContent = "Auto retry " + left + "s";
    timer = setInterval(function(){
      left--;
      if (left <= 0) { clearInterval(timer); cd.textContent = ""; check(); }
      else cd.textContent = "Auto retry " + left + "s";
    }, 1000);
  }

  function goGame(){
    if (/YOUR-PROJECT/.test(GAME_URL)) { history.length > 1 ? history.back() : location.reload(); return; }
    location.replace(GAME_URL);
  }

  function check(){
    if (busy) return;
    busy = true; clearInterval(timer); cd.textContent = "";
    retry.disabled = true; btxt.textContent = "Checking…";
    setState("checking", "Connection check pannitu irukkom…");

    var done = function(ok){
      busy = false; retry.disabled = false; btxt.textContent = "Retry";
      if (ok) { setState("ok", "Connect aagiduchu! Game load aagudhu…"); setTimeout(goGame, 700); }
      else { setState("fail", "Innum connect aagala"); schedule(); }
    };

    if (/YOUR-PROJECT/.test(GAME_URL)) { setTimeout(function(){ done(navigator.onLine); }, 600); return; }

    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function(){ if (ctl) ctl.abort(); }, 7000);
    fetch(GAME_URL + "/?_=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function(){ clearTimeout(t); done(true); })
      .catch(function(){ clearTimeout(t); done(false); });
  }

  retry.addEventListener("click", check);
  window.addEventListener("online", check);
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) check(); });
  schedule();
})();
</script>
</body>
</html>
