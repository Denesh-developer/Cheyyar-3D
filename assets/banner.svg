<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Cheyyar 3D Town banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.45" stop-color="#2a1245"/>
      <stop offset="0.8" stop-color="#8a3a3a"/>
      <stop offset="1" stop-color="#f08a50"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#ff5e1a"/>
      <animate attributeName="x1" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- sun glow -->
    <circle cx="190" cy="245" r="130" fill="url(#glow)">
      <animate attributeName="r" values="120;145;120" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="250" r="34" fill="#ffd9a0" opacity="0.9"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="75" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="28" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="34" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="82" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="890" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="70" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="36" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="95" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="14" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- skyline -->
    <g fill="#140a22">
      <rect x="0" y="222" width="70" height="50"/>
      <rect x="78" y="205" width="52" height="67"/>
      <rect x="138" y="232" width="86" height="40"/>
      <rect x="300" y="215" width="60" height="57"/>
      <rect x="368" y="236" width="90" height="36"/>
      <rect x="470" y="208" width="48" height="64"/>
      <rect x="526" y="228" width="80" height="44"/>
      <rect x="760" y="220" width="64" height="52"/>
      <rect x="832" y="236" width="70" height="36"/>
      <rect x="1050" y="212" width="58" height="60"/>
      <rect x="1116" y="228" width="84" height="44"/>
      <!-- gopuram -->
      <rect x="930" y="205" width="100" height="67"/>
      <rect x="942" y="178" width="76" height="27"/>
      <rect x="954" y="154" width="52" height="24"/>
      <rect x="965" y="133" width="30" height="21"/>
      <rect x="973" y="117" width="14" height="16"/>
      <path d="M966 117 Q980 96 994 117 Z"/>
      <rect x="979" y="88" width="2" height="12"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd34d">
      <rect x="92" y="222" width="6" height="8"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="110" y="236" width="6" height="8"/>
      <rect x="316" y="230" width="6" height="8"/>
      <rect x="338" y="244" width="6" height="8"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="484" y="224" width="6" height="8"/>
      <rect x="774" y="236" width="6" height="8"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></rect>
      <rect x="1064" y="228" width="6" height="8"/>
      <rect x="976" y="190" width="8" height="10"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="976" y="236" width="8" height="14"/>
    </g>

    <!-- road -->
    <rect x="0" y="268" width="1200" height="72" fill="#1a1a24"/>
    <rect x="0" y="268" width="1200" height="4" fill="#3b3b4a"/>
    <line x1="0" y1="304" x2="1200" y2="304" stroke="#ffd34d" stroke-width="3" stroke-dasharray="30 22" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="0.9s" repeatCount="indefinite"/>
    </line>

    <!-- car (right) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-160 292;1360 292" dur="9s" repeatCount="indefinite"/>
      <polygon points="66,-10 230,-30 230,10" fill="url(#beam)"/>
      <rect x="0" y="-18" width="68" height="15" rx="5" fill="#f5f5f7"/>
      <rect x="13" y="-31" width="40" height="15" rx="5" fill="#e4e4ea"/>
      <rect x="18" y="-28" width="14" height="9" rx="2" fill="#4a6a8a"/>
      <rect x="35" y="-28" width="14" height="9" rx="2" fill="#4a6a8a"/>
      <rect x="-2" y="-14" width="5" height="6" rx="2" fill="#ff4a4a"/>
      <circle cx="66" cy="-11" r="3.5" fill="#fff8d0"/>
      <circle cx="15" cy="-2" r="7" fill="#0c0c12"/><circle cx="53" cy="-2" r="7" fill="#0c0c12"/>
      <circle cx="15" cy="-2" r="2.5" fill="#777"/><circle cx="53" cy="-2" r="2.5" fill="#777"/>
    </g>

    <!-- bus (left, opposite lane) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="1420 330;-260 330" dur="15s" repeatCount="indefinite"/>
      <rect x="0" y="-38" width="120" height="32" rx="6" fill="#ff7a1a"/>
      <rect x="0" y="-14" width="120" height="8" fill="#c85a0a"/>
      <g fill="#ffe9b8">
        <rect x="8" y="-33" width="16" height="12" rx="2"/><rect x="30" y="-33" width="16" height="12" rx="2"/>
        <rect x="52" y="-33" width="16" height="12" rx="2"/><rect x="74" y="-33" width="16" height="12" rx="2"/>
        <rect x="96" y="-33" width="18" height="12" rx="2"/>
      </g>
      <circle cx="22" cy="-6" r="7" fill="#0c0c12"/><circle cx="98" cy="-6" r="7" fill="#0c0c12"/>
      <circle cx="-1" cy="-16" r="3.5" fill="#fff8d0"/>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
        <text x="600" y="132" font-size="84" font-weight="800" letter-spacing="8" fill="#000" opacity="0.35" filter="url(#soft)">CHEYYAR 3D</text>
        <text x="600" y="128" font-size="84" font-weight="800" letter-spacing="8" fill="url(#title)">CHEYYAR 3D</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.9s" fill="freeze"/>
        <text x="600" y="172" font-size="22" font-weight="500" letter-spacing="5" fill="#ffe9c8">NAMMA OORU  ·  WALK  ·  DRIVE  ·  RIDE THE BUS</text>
      </g>
    </g>
  </g>
</svg>
